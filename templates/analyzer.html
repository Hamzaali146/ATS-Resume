        <div class="mainanaly">
            <div class="analy-section">
                <h1>Analyze Your Resume through Job Description</h1>
                <form action="" class="analy-form">
                    <!-- Resume Upload -->
                    <label for="resume">Upload Resume:</label> 
                    <input type="file" id="resume" name="resume"> <br>

                    <!-- Job Description Input -->
                    <label for="jobDesc">Job Description:</label>
                    <textarea id="jobDesc" name="jobDesc" rows="4" placeholder="Enter the job description"></textarea> <br>

                    <button type="submit" class="submit-btn" >Analyze Now</button>
                </form>
            </div>
            <div class="visual-section">
                <h3>Generating your magic!</h3>
                <div style="display: none;" id="loading-circle" class="load"></div>
            </div>
        </div>
    </section>
    <script>
        document.querySelector('.analy-form').addEventListener('submit', async function(event) {
    event.preventDefault();
    await dabao();
});

        async function dabao() {
            // alert("working")
            const jobDesc = document.getElementById('jobDesc').value;
            const resume = document.getElementById('resume');
            const blogContent = document.querySelector('.visual-section');
            const formData = new FormData()
            if(resume && jobDesc){
                formData.append("desc",jobDesc)
                formData.append("pdfFile",resume.files[0])
                document.getElementById('loading-circle').style.display = 'block';
                blogContent.innerHTML = ""
                try{
                // alert("dsds")
                const response = await fetch("/generate",{
                    method:"POST",
                    body:formData
                })
                // alert(response)
                if(response.ok){
                    const data = await response.json();
                    // alert(data)
                    blogContent.innerHTML = data.content
                    // alert("Sucessfully send data:",data.content)
                }else{
                    blogContent.innerHTML = "Error processing file.";
                    console.error('Error Sending File',response.statusText)
                }
                document.getElementById('loading-circle').style.display = 'none';
            
            } catch(error){
                console.error("Fetch Error:",error)
            }

            } else{
                alert("upload file and text")
            }
            
            // alert(formData.text())
            // alert("dsdsd")
            
        }
